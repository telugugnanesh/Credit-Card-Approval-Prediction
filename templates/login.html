<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Loan Approval Prediction System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-body">
    <div class="login-card">
        <div class="login-header">
            <div class="login-logo">
                <i class="fa-solid fa-building-columns" style="color: var(--primary-color);"></i>
            </div>
            <h1 class="login-title">Loan Approval Predictor</h1>
            <p class="login-subtitle">Sign in to access prediction and model services</p>
        </div>
        {% if error %}
            <div class="alert alert-danger">
                <i class="fa-solid fa-circle-exclamation"></i> {{ error }}
            </div>
        {% endif %}
        <form action="{{ url_for('login') }}" method="POST">
            <div class="form-group" style="margin-bottom: 1.25rem;">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="officer@loanpredict.com" required>
            </div>
            
            <div class="form-group" style="margin-bottom: 2rem;">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">Sign In</button>
        </form>
        <div class="alert alert-info" style="margin-top: 2rem;">
            <div style="font-weight: 600; margin-bottom: 0.5rem;"><i class="fa-solid fa-circle-info"></i> Demo Credentials:</div>
            <ul style="padding-left: 1.25rem; font-size: 0.8rem;">
                <li><strong>Officer Account</strong>:<br><code>officer@loanpredict.com</code> (Password: <code>officer123</code>)</li>
                <li style="margin-top: 0.5rem;"><strong>Admin Account</strong>:<br><code>admin@loanpredict.com</code> (Password: <code>admin123</code>)</li>
            </ul>
        </div>
    </div>
</body>
</html>
